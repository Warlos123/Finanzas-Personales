[project]
name = "finanzas"
version = "0.1.0"
description = "Finanzas personales automáticas, todo local (PC + Android)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finanzas*"]

[tool.setuptools.package-data]
finanzas = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
